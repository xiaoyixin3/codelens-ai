services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: codelens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelens"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - codelens-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ..
    image: codelens-ai:${CODELENS_IMAGE_TAG:-1.0.0-beta.1}
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://codelens:${POSTGRES_PASSWORD}@postgres:5432/codelens
    command: ["java", "-Dcodelens.mode=migrate", "-jar", "/app/codelens-ai.jar"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: codelens-ai:${CODELENS_IMAGE_TAG:-1.0.0-beta.1}
    restart: unless-stopped
    init: true
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://codelens:${POSTGRES_PASSWORD}@postgres:5432/codelens
    command: ["java", "-Dcodelens.mode=api", "-jar", "/app/codelens-ai.jar"]
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: codelens-ai:${CODELENS_IMAGE_TAG:-1.0.0-beta.1}
    restart: unless-stopped
    init: true
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://codelens:${POSTGRES_PASSWORD}@postgres:5432/codelens
    command: ["java", "-Dcodelens.mode=worker", "-jar", "/app/codelens-ai.jar"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  retention:
    image: codelens-ai:${CODELENS_IMAGE_TAG:-1.0.0-beta.1}
    profiles: ["operations"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgres://codelens:${POSTGRES_PASSWORD}@postgres:5432/codelens
    command: ["node", "dist/retention.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  codelens-postgres:
