services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: codelens
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codelens"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - codelens-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: ..
    image: ${CODELENS_IMAGE_REFERENCE:-codelens-ai:1.0.0-beta.1}
    env_file:
      - path: ${CODELENS_ENV_FILE:-../.env}
        required: false
    environment:
      CODELENS_ENVIRONMENT: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/codelens
      CODELENS_DB_HOST: postgres
      CODELENS_DB_NAME: codelens
      CODELENS_DB_USER: codelens
      CODELENS_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["java", "-Dcodelens.mode=migrate", "-jar", "/app/codelens-ai.jar"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${CODELENS_IMAGE_REFERENCE:-codelens-ai:1.0.0-beta.1}
    restart: unless-stopped
    init: true
    env_file:
      - path: ${CODELENS_ENV_FILE:-../.env}
        required: false
    environment:
      CODELENS_ENVIRONMENT: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/codelens
      CODELENS_DB_HOST: postgres
      CODELENS_DB_NAME: codelens
      CODELENS_DB_USER: codelens
      CODELENS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CODELENS_TRUST_PROXY: "${CODELENS_TRUST_PROXY:-false}"
      CODELENS_PUBLIC_TRIAL: "${CODELENS_PUBLIC_TRIAL:-false}"
      CODELENS_PUBLIC_TRIAL_REPOSITORIES: "${CODELENS_PUBLIC_TRIAL_REPOSITORIES:-}"
    command: ["java", "-Dcodelens.mode=api", "-jar", "/app/codelens-ai.jar"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "${CODELENS_BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ${CODELENS_IMAGE_REFERENCE:-codelens-ai:1.0.0-beta.1}
    restart: unless-stopped
    init: true
    env_file:
      - path: ${CODELENS_ENV_FILE:-../.env}
        required: false
    environment:
      CODELENS_ENVIRONMENT: production
      DATABASE_URL: jdbc:postgresql://postgres:5432/codelens
      CODELENS_DB_HOST: postgres
      CODELENS_DB_NAME: codelens
      CODELENS_DB_USER: codelens
      CODELENS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CODELENS_SEMANTIC_WORKSPACE_ROOT: /var/lib/codelens/semantic
      CODELENS_SEMANTIC_ENABLED: "${CODELENS_SEMANTIC_ENABLED:-false}"
      CODELENS_SEMANTIC_REPOSITORIES: "${CODELENS_SEMANTIC_REPOSITORIES:-}"
      CODELENS_PUBLIC_TRIAL: "${CODELENS_PUBLIC_TRIAL:-false}"
      CODELENS_PUBLIC_TRIAL_REPOSITORIES: "${CODELENS_PUBLIC_TRIAL_REPOSITORIES:-}"
    command: ["java", "-Dcodelens.mode=worker", "-jar", "/app/codelens-ai.jar"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - codelens-semantic:/var/lib/codelens/semantic
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      migrate:
        condition: service_completed_successfully

  retention:
    image: ${CODELENS_IMAGE_REFERENCE:-codelens-ai:1.0.0-beta.1}
    profiles: ["operations"]
    env_file:
      - path: ${CODELENS_ENV_FILE:-../.env}
        required: false
    environment:
      CODELENS_DB_HOST: postgres
      CODELENS_DB_NAME: codelens
      CODELENS_DB_USER: codelens
      CODELENS_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["node", "dist/retention.js"]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  codelens-postgres:
  codelens-semantic:
