name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Java and TypeScript quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_WEBHOOK_SECRET: ci-only-webhook-secret-not-for-production
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run automated release checks
        run: npm run release:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  runtime:
    name: PostgreSQL, migration compatibility, and production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://codelens:codelens@127.0.0.1:5432/codelens
      REDIS_URL: redis://127.0.0.1:6379
      GITHUB_WEBHOOK_SECRET: ci-only-webhook-secret-not-for-production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codelens
          POSTGRES_PASSWORD: codelens
          POSTGRES_DB: codelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codelens -d codelens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Apply migrations
        run: npm run db:migrate

      - name: Verify Java PostgreSQL queue and provider contracts
        env:
          CODELENS_INTEGRATION_TESTS: 'true'
        run: mvn -q test

      - name: Run full pipeline smoke test
        run: npm run smoke:pipeline

      - name: Build production image
        run: docker build --tag codelens-ai:ci .

      - name: Verify non-root runtime image
        run: test "$(docker image inspect codelens-ai:ci --format '{{.Config.User}}')" = "codelens"

      - name: Verify bundled migration and pipeline commands
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e GITHUB_WEBHOOK_SECRET="$GITHUB_WEBHOOK_SECRET" \
            codelens-ai:ci java -Dcodelens.mode=migrate -jar /app/codelens-ai.jar
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e GITHUB_WEBHOOK_SECRET="$GITHUB_WEBHOOK_SECRET" \
            codelens-ai:ci node dist/smoke-pipeline.js

      - name: Verify production API readiness
        run: |
          docker run --rm --detach --network host --name codelens-api-ci \
            -e DATABASE_URL="$DATABASE_URL" \
            -e REDIS_URL="$REDIS_URL" \
            -e GITHUB_WEBHOOK_SECRET="$GITHUB_WEBHOOK_SECRET" \
            codelens-ai:ci
          trap 'docker stop codelens-api-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/readyz; then
              exit 0
            fi
            sleep 1
          done
          docker logs codelens-api-ci
          exit 1
