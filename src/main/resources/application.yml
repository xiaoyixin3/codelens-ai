spring:
  application:
    name: codelens-ai
  datasource:
    url: ${CODELENS_JDBC_URL:jdbc:postgresql://localhost:5432/codelens}
    username: ${CODELENS_DB_USER:codelens}
    password: ${CODELENS_DB_PASSWORD:codelens}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:3000}
  shutdown: graceful
  max-http-request-header-size: 32KB
  tomcat:
    max-swallow-size: 2MB
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: ${LOG_LEVEL:INFO}
